<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Asset library example</title>
<!-- Assets come from: node system/assets/library.mjs use icon-lightbulb original-success-check sfx-pop sfx-chime --project system/assets/example -->
<script src="assets/library/gsap.min.js"></script>
<script src="assets/library/motion.js"></script>
<script src="assets/library/lottie.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14181d; }
#root { width: 100%; height: 100%; position: relative; overflow: hidden; }
.bulb { position: absolute; left: 420px; top: 560px; width: 240px; height: 240px; }
.check { position: absolute; left: 390px; top: 1020px; width: 300px; height: 300px; }
#icon-lightbulb { color: #ffffff; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <!-- 1. Static icon with a seek-safe entrance at 0.6 s, its pop sound starts 0.116 s early (the file's lead-in) so the hit lands on the beat. -->
  <div id="bulb-host" class="clip bulb" data-start="0.6" data-duration="3.4" data-track-index="1">
    <svg id="icon-lightbulb" style="width:100%; height:100%;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M176,232a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,232Zm40-128a87.55,87.55,0,0,1-33.64,69.21A16.24,16.24,0,0,0,176,186v6a16,16,0,0,1-16,16H96a16,16,0,0,1-16-16v-6a16,16,0,0,0-6.23-12.66A87.59,87.59,0,0,1,40,104.49C39.74,56.83,78.26,17.14,125.88,16A88,88,0,0,1,216,104Zm-16,0a72,72,0,0,0-73.74-72c-39,.92-70.47,33.39-70.26,72.39a71.65,71.65,0,0,0,27.64,56.3A32,32,0,0,1,96,186v6h64v-6a32.15,32.15,0,0,1,12.47-25.35A71.65,71.65,0,0,0,200,104Zm-16.11-9.34a57.6,57.6,0,0,0-46.56-46.55,8,8,0,0,0-2.66,15.78c16.57,2.79,30.63,16.85,33.44,33.45A8,8,0,0,0,176,104a9,9,0,0,0,1.35-.11A8,8,0,0,0,183.89,94.66Z"/></svg>
  </div>
  <audio id="sfx-pop-0_6" src="assets/library/sounds/pixabay/pop.mp3" data-start="0.484" data-duration="0.72" data-track-index="3" data-volume="0.35"></audio>

  <!-- 2. Lottie whose frame 0 lands at the host's data-start (2.0 s), chime started 0.416 s early to land on it. -->
  <div id="success-host" class="clip check" data-composition-id="success-check" data-no-timeline data-start="2" data-duration="2" data-track-index="2">
    <div id="success-check" style="width:100%; height:100%;"></div>
  </div>
  <audio id="sfx-chime-2" src="assets/library/sounds/pixabay/chime.mp3" data-start="1.584" data-duration="2" data-track-index="4" data-volume="0.35"></audio>
</div>
<script>
  window.__hfLottie = window.__hfLottie || [];
  window.__hfLottie.push(lottie.loadAnimation({ container: document.getElementById("success-check"), renderer: "svg", loop: false, autoplay: false, path: "assets/library/animations/lottie/original/success-check.json" }));

  const tl = gsap.timeline({ paused: true });
  HFMotion.popIn(tl, "#icon-lightbulb", 0.6);
  HFMotion.pulse(tl, "#icon-lightbulb", 1.4, { count: 1 });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
</script>
</body>
</html>
