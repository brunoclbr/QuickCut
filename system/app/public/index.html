<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video companion</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview"><b id="brand-name">Video companion</b><span id="brand-sub">LOCAL · READ-ONLY</span></a>
      <nav id="nav" aria-label="Main navigation"></nav>
      <p class="sidebar-note">One brand or client per copy of this folder.</p>
    </aside>
    <div class="content">
      <header class="topbar">
        <nav id="crumb" class="crumb" aria-label="Breadcrumb"></nav>
        <button id="refresh" class="ghost" title="Re-read projects and files from disk">Refresh files</button>
      </header>
      <aside id="notice" hidden>
        <span><strong>Make it yours.</strong> Customize through your AI app. Changing the core folder structure may break the workflow; keep a backup.</span>
        <button id="dismiss" class="ghost">Got it</button>
      </aside>
      <main id="main"><p class="muted">Reading your local folder…</p></main>
      <footer><span id="folder" class="mono"></span><span>Read-only view of your files. Changes are made by your AI app.</span></footer>
    </div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</body>
</html>
